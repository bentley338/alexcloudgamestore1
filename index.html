<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Cloud Game | Main Game Tanpa Download</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --accent-color: #3b82f6; /* Modern Blue Glow */
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        h1, h2, h3 {
            font-family: 'Poppins', sans-serif;
        }

        /* --- LOADING SCREEN --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease, visibility 1s;
        }

        .loader-logo {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        .loader-logo span { color: var(--accent-color); }

        .loader-bar {
            width: 200px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: var(--accent-color);
            position: absolute;
            animation: load 2.5s forwards ease-in-out;
            box-shadow: 0 0 15px var(--accent-color);
        }

        @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1); } }

        /* --- MUSIC CONTROLLER --- */
        .music-control {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 50px;
            cursor: pointer;
            height: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            padding: 0 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .music-control:hover {
            transform: scale(1.05);
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .music-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- WHATSAPP FLOATING --- */
        .wa-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
            z-index: 100;
            transition: var(--transition);
            text-decoration: none;
        }

        .wa-float:hover {
            transform: scale(1.1) rotate(10deg);
        }

        /* --- SCROLL ANIMATION CLASSES --- */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: 1s all ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- NAVBAR --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 90;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            text-decoration: none;
            letter-spacing: -1px;
        }

        .logo span { color: var(--accent-color); }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover { color: white; }

        /* --- HERO SECTION --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10%;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 20%;
            width: 600px;
            height: 600px;
            background: var(--accent-color);
            filter: blur(180px);
            opacity: 0.12;
            z-index: 0;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            line-height: 1.1;
            margin-bottom: 20px;
            z-index: 1;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.6);
            max-width: 700px;
            margin-bottom: 40px;
            z-index: 1;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            z-index: 1;
        }

        .btn {
            padding: 16px 35px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            font-size: 1rem;
            cursor: pointer;
            border: none;
            outline: none;
        }

        .btn-glow {
            background: white;
            color: black;
            box-shadow: 0 0 0px rgba(255,255,255,0);
        }

        .btn-glow:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255,255,255,0.4);
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 1px solid var(--glass-border);
        }

        .btn-outline:hover {
            background: var(--glass-bg);
            border-color: white;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        /* --- GAMES SECTION --- */
        .section {
            padding: 100px 8%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-header h2 { font-size: 2.5rem; margin-bottom: 15px; }
        .section-header p { color: #888; }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .game-card {
            background: #111;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            transition: var(--transition);
            position: relative;
            height: 450px;
        }

        .game-card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: var(--accent-color);
            box-shadow: 0 20px 50px rgba(59, 130, 246, 0.25);
        }

        .game-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
            transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .game-card:hover .game-img {
            filter: brightness(1);
            transform: scale(1.1);
        }

        .game-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
        }

        .game-card h3 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .game-tag {
            display: inline-block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            font-weight: 800;
            margin-bottom: 8px;
            padding: 4px 10px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 5px;
            width: fit-content;
        }

        .game-tag.ready { color: #2ecc71; background: rgba(46, 204, 113, 0.1); }

        /* --- KEUNGGULAN --- */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
        }

        .feature-item {
            text-align: center;
            padding: 40px 20px;
            background: var(--glass-bg);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            transition: var(--transition);
        }

        .feature-item:hover {
            background: rgba(255,255,255,0.05);
            transform: scale(1.05);
            border-color: var(--accent-color);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.1);
        }

        .feature-item i {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));
        }

        /* --- PRICING SECTION --- */
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .price-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .price-card.popular {
            border-color: var(--accent-color);
            background: rgba(59, 130, 246, 0.07);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.1);
        }

        .price-card:hover {
            transform: translateY(-15px);
            background: rgba(255,255,255,0.05);
            border-color: white;
        }

        .price-name { font-size: 1.2rem; margin-bottom: 10px; color: #aaa; }
        .price-value { font-size: 2.2rem; font-weight: 800; margin-bottom: 30px; color: white; }
        
        .price-features {
            list-style: none;
            text-align: left;
            margin-bottom: 40px;
        }

        .price-features li {
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .price-features i { color: #2ecc71; font-size: 1.1rem; }

        .btn-full { width: 100%; }

        /* --- HOW IT WORKS --- */
        .step-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .step {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
            align-items: center;
            background: var(--glass-bg);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            transition: var(--transition);
        }

        .step:hover {
            border-color: var(--accent-color);
            transform: translateX(10px);
        }

        .step-num {
            min-width: 60px;
            height: 60px;
            background: var(--accent-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1.5rem;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        /* --- TESTIMONI --- */
        .testi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .testi-card {
            background: var(--glass-bg);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            transition: var(--transition);
        }

        .testi-card:hover { transform: scale(1.02); background: rgba(255,255,255,0.05); }

        .user-info { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .user-img { width: 50px; height: 50px; border-radius: 50%; background: #333; overflow: hidden; border: 2px solid var(--accent-color); }
        .user-img img { width: 100%; height: 100%; object-fit: cover; }

        /* --- FAQ --- */
        .faq-container { max-width: 800px; margin: 0 auto; }
        .faq-item {
            margin-bottom: 15px;
            border-radius: 15px;
            background: var(--glass-bg);
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }
        .faq-question {
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            transition: 0.3s;
        }
        .faq-question:hover { background: rgba(255,255,255,0.05); }
        .faq-answer {
            padding: 0 20px;
            max-height: 0;
            overflow: hidden;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            color: #888;
            font-size: 0.95rem;
        }
        .faq-item.active .faq-answer { padding: 0 20px 20px 20px; max-height: 200px; }
        .faq-item.active .faq-question { color: var(--accent-color); }
        .faq-item.active i { transform: rotate(180deg); color: var(--accent-color); }

        /* --- MODAL PAYMENT --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
        }

        .modal-content {
            background: #0c0c0c;
            width: 90%;
            max-width: 500px;
            border-radius: 40px;
            padding: 50px 40px;
            border: 1px solid var(--glass-border);
            text-align: center;
            position: relative;
            animation: modalIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        @keyframes modalIn {
            from { transform: scale(0.8) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .close-modal {
            position: absolute;
            top: 25px;
            right: 30px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #555;
            transition: 0.3s;
        }
        .close-modal:hover { color: white; }

        .pay-options {
            display: flex;
            flex-direction: column; gap: 15px; margin-top: 40px;
        }

        .pay-btn {
            padding: 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }

        .btn-wa { background: #25d366; color: white; box-shadow: 0 5px 20px rgba(37, 211, 102, 0.2); }
        .btn-wa:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(37, 211, 102, 0.4); }

        .btn-qris { background: white; color: black; }
        .btn-qris:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2); }

        .qris-display {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.5s forwards;
        }

        .qris-display img {
            width: 100%;
            max-width: 280px;
            border-radius: 20px;
            border: 5px solid white;
            margin: 0 auto;
        }

        /* --- FOOTER --- */
        footer {
            padding: 80px 8% 40px;
            background: #080808;
            border-top: 1px solid var(--glass-border);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 40px;
            margin-bottom: 50px;
        }

        .footer-brand h3 { margin-bottom: 15px; font-size: 1.8rem; }
        .footer-brand p { color: #555; max-width: 350px; line-height: 1.8; }

        .footer-links h4 { margin-bottom: 25px; color: var(--accent-color); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; }
        .footer-links ul { list-style: none; }
        .footer-links li { margin-bottom: 12px; }
        .footer-links a { color: #888; text-decoration: none; transition: 0.3s; font-size: 0.9rem; }
        .footer-links a:hover { color: white; padding-left: 5px; }

        .copyright {
            text-align: center;
            padding-top: 40px;
            border-top: 1px solid rgba(255,255,255,0.05);
            color: #444;
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 3rem; }
            .nav-links { display: none; }
            .btn-container { flex-direction: column; width: 100%; }
            .music-control { left: 20px; bottom: 20px; }
            .music-label { display: none; }
            .wa-float { right: 20px; bottom: 20px; }
            .game-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        <div class="loader-bar">

        </div>

    <!-- Music Controller -->

        <i id="music-icon" class="fas fa-volume-mute"></i>
        <span class="music-label" id="music-status">OFF</span>
    </div>
